<!DOCTYPE html>
<html>
    <head>
        <title>ローラ姫</title>
        <meta charset="utf-8">
        <script>
            alert('ローラもおともしとうございます。');
            let agreed = false;
            while(!agreed) {
                agreed = confirm('このローラもつれてってくださいますわね。');
                if(!agreed) {
                    alert('そんな ひどい・・・');
                }
            }
            alert('うれしゅうございます。ぽっ');
        </script>    
    </head>
    <body>
        <h1>ローラ姫</h1>
    </body>
</html>
