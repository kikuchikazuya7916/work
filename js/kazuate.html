<!DOCTYPE html>
<html>
    <head>
        <title>数当てゲーム</title>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            const random = Math.random();
            const answer = Math.floor(random * 10) + 1;
            let input = 0;
            let count = 0;
            while(input != answer) {
                input = prompt('数字を入れてください。 (1～10)');
                count = count + 1;
                if(input < answer) {
                    alert('数字が小さいです。');
                }
                else if(input > answer) {
                    alert('数字が大きいです。');
                }
                else {
                    alert('正解です。' + count + '回で正解しました。');
                }
            }
        </script>
    </body>
</html>
